<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Запись в барбершоп «Борода»</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/*
  Telegram Mini App. Цвета берутся из темы Telegram пользователя (светлой или тёмной),
  поэтому приложение выглядит «родным». Фирменный акцент барбершопа — латунь.
*/
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --bg2:var(--tg-theme-secondary-bg-color,#f1f2f4);
  --text:var(--tg-theme-text-color,#16191c);
  --hint:var(--tg-theme-hint-color,#8a9099);
  --btn:var(--tg-theme-button-color,#2f80ed);
  --btn-text:var(--tg-theme-button-text-color,#ffffff);
  --brass:#C79A3A;
  --busy:var(--tg-theme-hint-color,#b8bcc3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg2);color:var(--text);font:400 16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
header{background:var(--bg);padding:18px 16px 14px;display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;border-radius:50%;background:#16342B;display:grid;place-items:center;flex-shrink:0}
header b{display:block;font-size:17px}
header span{color:var(--hint);font-size:14px}
section{background:var(--bg);margin-top:10px;padding:14px 16px}
h2{font-size:15px;font-weight:600;color:var(--hint);margin:0 0 10px}

.services{display:grid;gap:8px}
.svc{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--bg2);color:var(--text);border:2px solid transparent;border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer}
.svc small{display:block;color:var(--hint);font-size:13px}
.svc .p{font-weight:600;white-space:nowrap}
.svc[aria-pressed="true"]{border-color:var(--brass)}

.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 58px;background:var(--bg2);color:var(--text);border:2px solid transparent;border-radius:12px;padding:8px 0;
  text-align:center;font:inherit;cursor:pointer}
.day small{display:block;color:var(--hint);font-size:12px}
.day b{font-size:18px}
.day[aria-pressed="true"]{border-color:var(--brass)}
.day:disabled{opacity:.4;cursor:default}

.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.time{background:var(--bg2);color:var(--text);border:2px solid transparent;border-radius:10px;padding:10px 0;font:600 15px/1 inherit;cursor:pointer}
.time[aria-pressed="true"]{border-color:var(--brass);background:var(--brass);color:#1b1305}
.time:disabled{color:var(--busy);text-decoration:line-through;cursor:default}
.empty{color:var(--hint);font-size:14px;margin:0}

.summary{font-size:15px}
.summary div{display:flex;justify-content:space-between;padding:4px 0}
.summary span{color:var(--hint)}
.fallback{position:fixed;left:16px;right:16px;bottom:16px;background:var(--btn);color:var(--btn-text);border:0;border-radius:12px;
  padding:15px;font:600 16px inherit;cursor:pointer;display:none}
.fallback:disabled{opacity:.5}
.note{color:var(--hint);font-size:13px;text-align:center;margin:12px 16px}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C79A3A" stroke-width="2" stroke-linecap="round">
      <circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.2 16 18 3M15.8 16 6 3"/></svg>
  </div>
  <div><b>Барбершоп «Борода»</b><span>ул. Примерная, 10 · запись онлайн</span></div>
</header>

<section>
  <h2>Услуга</h2>
  <div class="services" id="services"></div>
</section>

<section>
  <h2>День</h2>
  <div class="days" id="days"></div>
</section>

<section>
  <h2>Время</h2>
  <div class="times" id="times"></div>
</section>

<section id="summaryBox" hidden>
  <h2>Ваша запись</h2>
  <div class="summary" id="summary"></div>
</section>

<p class="note" id="note"></p>
<button class="fallback" id="fallbackBtn" disabled>Записаться</button>

<script>
/* ===================== НАСТРОЙКИ ===================== */
const SERVICES = [
  { name: 'Мужская стрижка',   price: 1200, minutes: 60 },
  { name: 'Стрижка машинкой',  price: 700,  minutes: 30 },
  { name: 'Оформление бороды', price: 800,  minutes: 30 },
  { name: 'Стрижка + борода',  price: 1800, minutes: 90 },
  { name: 'Детская стрижка',   price: 900,  minutes: 30 },
];
const WORK_DAYS = [1, 2, 3, 4, 5, 6];   // пн–сб (0 — воскресенье)
const HOURS = ['10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00'];
const DAYS_AHEAD = 10;
/* ===================================================== */

const tg = window.Telegram ? window.Telegram.WebApp : null;
const inTelegram = !!(tg && tg.initData);
const state = { service: null, day: null, time: null };
const rub = n => n.toLocaleString('ru-RU') + ' ₽';
const WD = ['вс','пн','вт','ср','чт','пт','сб'];

if (inTelegram) { tg.ready(); tg.expand(); }

// Демо: «занятые» слоты. В настоящем проекте их отдаёт сервер или таблица.
function isBusy(date, time) {
  const s = date.getDate() * 31 + parseInt(time) * 7;
  return s % 5 === 0 || s % 7 === 0;
}
function haptic() { if (inTelegram && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); }

function pick(list, btn) {
  list.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', 'false'));
  btn.setAttribute('aria-pressed', 'true');
  haptic();
}

// Услуги
const svcBox = document.getElementById('services');
SERVICES.forEach(s => {
  const b = document.createElement('button');
  b.className = 'svc'; b.type = 'button'; b.setAttribute('aria-pressed', 'false');
  b.innerHTML = '<span><span class="n"></span><small></small></span><span class="p"></span>';
  b.querySelector('.n').textContent = s.name;
  b.querySelector('small').textContent = s.minutes + ' мин';
  b.querySelector('.p').textContent = rub(s.price);
  b.onclick = () => { state.service = s; pick(svcBox, b); update(); };
  svcBox.appendChild(b);
});

// Дни
const daysBox = document.getElementById('days');
const today = new Date(); today.setHours(0, 0, 0, 0);
for (let i = 0; i < DAYS_AHEAD; i++) {
  const d = new Date(today); d.setDate(today.getDate() + i);
  const b = document.createElement('button');
  b.className = 'day'; b.type = 'button'; b.setAttribute('aria-pressed', 'false');
  b.innerHTML = `<small>${i === 0 ? 'сегодня' : WD[d.getDay()]}</small><b>${d.getDate()}</b>`;
  if (!WORK_DAYS.includes(d.getDay())) { b.disabled = true; b.title = 'Выходной'; }
  b.onclick = () => { state.day = d; state.time = null; pick(daysBox, b); renderTimes(); update(); };
  daysBox.appendChild(b);
}

// Время
const timesBox = document.getElementById('times');
function renderTimes() {
  timesBox.innerHTML = '';
  if (!state.day) { timesBox.innerHTML = '<p class="empty">Сначала выберите день</p>'; return; }
  const now = new Date();
  HOURS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'time'; b.type = 'button'; b.textContent = t; b.setAttribute('aria-pressed', 'false');
    const slot = new Date(state.day); slot.setHours(parseInt(t), 0, 0, 0);
    if (slot < now || isBusy(state.day, t)) { b.disabled = true; b.setAttribute('aria-label', t + ', занято'); }
    b.onclick = () => { state.time = t; pick(timesBox, b); update(); };
    timesBox.appendChild(b);
  });
}
renderTimes();

// Сводка и кнопка
const fallbackBtn = document.getElementById('fallbackBtn');
function dateText(d) { return d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }); }

function update() {
  const ready = state.service && state.day && state.time;
  const box = document.getElementById('summaryBox');
  box.hidden = !ready;
  if (ready) {
    document.getElementById('summary').innerHTML =
      `<div><span>Услуга</span><b></b></div><div><span>Когда</span><b></b></div><div><span>Стоимость</span><b></b></div>`;
    const b = box.querySelectorAll('b');
    b[0].textContent = state.service.name;
    b[1].textContent = dateText(state.day) + ', ' + state.time;
    b[2].textContent = rub(state.service.price);
  }
  if (inTelegram) {
    tg.MainButton.setText(ready ? `Записаться на ${state.time}` : 'Выберите услугу, день и время');
    tg.MainButton.show();
    ready ? tg.MainButton.enable() : tg.MainButton.disable();
  } else {
    fallbackBtn.disabled = !ready;
  }
}

function submit() {
  if (!(state.service && state.day && state.time)) return;
  const payload = {
    service: state.service.name, price: state.service.price, minutes: state.service.minutes,
    date: state.day.toLocaleDateString('ru-RU'), weekday: WD[state.day.getDay()], time: state.time,
  };
  if (inTelegram) {
    tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
    tg.sendData(JSON.stringify(payload));   // бот получит это сообщение, окно закроется само
  } else {
    alert('Демо в браузере. В Telegram запись уйдёт боту:\n' + JSON.stringify(payload, null, 2));
  }
}

if (inTelegram) {
  tg.MainButton.onClick(submit);
} else {
  fallbackBtn.style.display = 'block';
  fallbackBtn.onclick = submit;
  document.getElementById('note').textContent = 'Это мини-приложение Telegram. Сейчас открыто в браузере — для демонстрации.';
}
update();
</script>
</body>
</html>
